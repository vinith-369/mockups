 real-world needs.","3. Structured Teaching Loop: Add a brief instructor-led walkthrough demonstrating how to classify a complex instrument like a 91-day Treasury Bill. Show students the exact reasoning process for distinguishing between debt and money market instruments before they start the worksheet."]},
